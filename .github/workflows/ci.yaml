name: Build and Test

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check:types

      - name: Check workflow and script formatting
        run: npm run check:format

      - name: Check content and internal links
        id: content-check
        continue-on-error: true
        run: npm run check:content -- --format json --output reports/content-quality.json

      - name: Upload content quality report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: content-quality-report-${{ matrix.os }}
          path: reports/content-quality.json
          if-no-files-found: warn

      - name: Test
        run: npm test

      - name: Build ArkDocs content
        if: always() && steps.content-check.outcome == 'success'
        run: npx quartz build --bundleInfo -d content
