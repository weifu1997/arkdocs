name: Build and Test

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check:types

      - name: Check workflow and script formatting
        run: npm run check:format

      - name: Check content and internal links on content/
        run: npm run check:content

      - name: Run content-quality CLI against the fixtures
        run: npm run check:content -- --root fixtures/content-quality --format json --output reports/content-quality.json
        continue-on-error: true

      - name: Test public search discovery
        run: npm run test:content-discovery

      - name: Test content quality checker
        run: npm run test:content-quality

      - name: Test
        run: npm test

      - name: Build ArkDocs content
        run: npx quartz build --bundleInfo -d content
