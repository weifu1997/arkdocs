name: Deploy v5 Preview

on:
  push:
    branches:
      - main
      - v5
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy-v5:
    runs-on: ubuntu-latest
    name: Deploy ArkDocs to Cloudflare Pages
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check:types

      - name: Check workflow and script formatting
        run: npm run check:format

      - name: Check content and internal links
        id: content-check
        continue-on-error: true
        run: npm run check:content -- --format json --output reports/content-quality.json

      - name: Upload content quality report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: content-quality-report-deploy-v5
          path: reports/content-quality.json
          if-no-files-found: warn

      - name: Build ArkDocs
        if: always() && steps.content-check.outcome == 'success'
        run: npx quartz build -d content -v

      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; skipping deployment."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.cloudflare.outputs.available == 'true'
        uses: AdrianGonz97/refined-cf-pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: arkdocs
          deploymentName: v5 Branch Preview
          branch: ${{ github.ref_name }}
          directory: public
